<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paparajote Lunar · burning activity calendar</title>
    <meta
      name="description"
      content="When and where fire burns: twenty-four years of harmonized MODIS and VIIRS hotspots for any area on Earth."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t !== 'light' && t !== 'dark')
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.classList.toggle('dark', t === 'dark')
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0b1640" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Paparajote Lunar" />
    <meta property="og:title" content="Paparajote Lunar" />
    <meta property="og:url" content="https://paparajotelunar.com/" />
    <meta property="og:image" content="https://paparajotelunar.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Paparajote Lunar mascot: a paparajote in an astronaut suit"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
