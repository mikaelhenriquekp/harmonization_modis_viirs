name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; queue them instead of cancelling mid-deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to production
    needs: ci
    runs-on: [self-hosted, linux]
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}
    env:
      COMPOSE: docker compose -p app -f deploy/docker-compose.prod.yml --env-file deploy/.env
    steps:
      - uses: actions/checkout@v5

      - name: Write production env file
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER || 'app' }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB || 'app' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          umask 077
          {
            echo "DOMAIN=${DOMAIN}"
            echo "ACME_EMAIL=${ACME_EMAIL}"
            echo "POSTGRES_USER=${POSTGRES_USER}"
            echo "POSTGRES_DB=${POSTGRES_DB}"
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
          } > deploy/.env

      - name: Build and start containers
        run: $COMPOSE up -d --build --remove-orphans

      - name: Wait for API health (migrations included)
        run: |
          for _ in $(seq 1 30); do
            if $COMPOSE exec -T caddy wget -qO- http://api:8080/api/health; then
              echo; echo "API is healthy"; exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy" >&2
          $COMPOSE ps
          $COMPOSE logs --tail=100 api
          exit 1

      - name: Show running services
        if: always()
        run: $COMPOSE ps

      - name: Clean up
        if: always()
        run: |
          rm -f deploy/.env
          docker image prune -f
