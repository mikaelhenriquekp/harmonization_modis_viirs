name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: [self-hosted, linux]
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}
    env:
      COMPOSE: docker compose -p app -f deploy/docker-compose.prod.yml --env-file deploy/.env
    steps:
      - uses: actions/checkout@v5

      - name: Write .env
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER || 'app' }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB || 'app' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
          ASSISTANT_PER_HOUR: ${{ vars.ASSISTANT_PER_HOUR || '20' }}
        run: |
          umask 077
          {
            echo "DOMAIN=${DOMAIN}"
            echo "ACME_EMAIL=${ACME_EMAIL}"
            echo "POSTGRES_USER=${POSTGRES_USER}"
            echo "POSTGRES_DB=${POSTGRES_DB}"
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "FIRMS_MAP_KEY=${FIRMS_MAP_KEY}"
            echo "OPENAI_API_KEY=${OPENAI_API_KEY}"
            echo "OPENAI_MODEL=${OPENAI_MODEL}"
            echo "ASSISTANT_PER_HOUR=${ASSISTANT_PER_HOUR}"
          } > deploy/.env

      - name: Compose up
        run: $COMPOSE up -d --build --remove-orphans

      - name: Health check
        run: |
          for _ in $(seq 1 30); do
            if $COMPOSE exec -T caddy wget -qO- http://api:8080/api/health; then
              exit 0
            fi
            sleep 2
          done
          $COMPOSE ps
          $COMPOSE logs --tail=100 api
          exit 1

      - name: Status
        if: always()
        run: $COMPOSE ps

      - name: Cleanup
        if: always()
        run: |
          rm -f deploy/.env
          docker image prune -f
