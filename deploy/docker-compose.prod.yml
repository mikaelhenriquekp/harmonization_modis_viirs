name: app

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      PORT: "8080"
      LOG_LEVEL: info
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-app}?sslmode=disable
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  # Downloads FIRMS, harmonizes every country and refreshes recent days every 6 hours.
  ingest:
    build:
      context: ../backend
    entrypoint: ["/ingest"]
    restart: unless-stopped
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-app}?sslmode=disable
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:?FIRMS_MAP_KEY is required}
      INGEST_INTERVAL: 6h
      INGEST_WORKERS: "2"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../frontend
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
