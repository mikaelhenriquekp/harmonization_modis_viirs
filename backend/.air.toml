root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  entrypoint = ["./tmp/api"]
  include_ext = ["go", "sql"]
  exclude_dir = ["tmp", "bin", "vendor"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true
  # Polling makes file watching reliable on Docker Desktop bind mounts.
  poll = true
  poll_interval = 500

[log]
  time = false

[misc]
  clean_on_exit = true
